[package]
name = "herdr-usage"
version = "0.1.0"
edition = "2024"
description = "A Herdr popup with Claude and Codex plan limits and CPU, RAM and agents for every machine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MagnusBVillumsen/herdr-usage"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
